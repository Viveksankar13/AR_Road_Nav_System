name: ar_road_nav
description: AR Road Navigation with Pothole Detection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  http: ^1.1.0
  sensors_plus: ^3.1.0
  permission_handler: ^11.0.1
  cupertino_icons: ^1.0.2
  camera: ^0.10.5+9
  flutter_compass: ^0.8.0
  provider: ^6.1.1
  image: ^4.1.3
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
